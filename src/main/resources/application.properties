spring.application.name=employee-creator

spring.datasource.url=jdbc:mysql://localhost:3306/employee_creator
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.dialect=org.hibernate.dialect.MySQLDialect
spring.profiles.active=dev

# Session cookie. localhost:5173 and localhost:8080 are the same site (ports do
# not affect site), so lax works in development. A frontend deployed on a
# different domain needs same-site=none plus secure=true.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

app.cors.allowed-origins=http://localhost:5173
